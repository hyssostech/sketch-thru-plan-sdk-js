# SonarQube scan parameters for sketch-thru-plan-sdk-js.
#
# These lived only in a throwaway shell script when the STP-740 baseline was
# measured, which meant the numbers in .github/sonar-baseline-STP-740.txt were
# not reproducible by anyone but the person who took them. A baseline nobody
# can re-derive is not a baseline. They are here so the next scan measures the
# same subject as the last one.
#
# The scope below is deliberately IDENTICAL to the one the re-derived
# sdk-js-ratchet-v2 thresholds were calibrated against (126 files, 16,773
# ncloc, measured 2026-09-14). Changing an exclusion changes the subject and
# silently invalidates every threshold in that file. If the scope must change,
# re-derive the thresholds in the same commit.

sonar.projectKey=sketch-thru-plan-sdk-js
sonar.projectName=Sketch-thru-Plan SDK (JavaScript)

sonar.sources=.

# Dependencies, build output and generated reports. Everything first-party
# stays in - including samples/ and quickstart/, which is where the 36
# vulnerabilities the narrow scan missed actually live.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/.sonarqube/**

# Coverage. Without this the analyser reports 0.0% no matter what the suite
# covers, which is precisely what the STP-740 baseline recorded for all three
# scopes - the suite was never the problem, the import was missing.
# Requires `npm run build && npm run test:coverage` to have run first: the
# build because a contract test compares bundle mtimes, and the coverage run
# because vitest does not write reports when a test fails.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The SDK sources are TypeScript; the lcov paths must resolve against them.
sonar.sourceEncoding=UTF-8
