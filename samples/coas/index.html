<!DOCTYPE html>
<html>
  <head>
    <title>Sketch-thru-Plan Browser App</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">  
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <!-- Renderers -->
    <!-- Speech recognition -->
    <script type="application/javascript" src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js" integrity="sha384-M3ff7S+yGrJgt57GlKT5DSXOIH6BmWyNccNicmYs+IKE9j3IV0Mxjm2/CjqFdNez" crossorigin="anonymous"></script>
    <!-- STP SDK and plugins - needs to be added *after* the references to speech and communication services it may use -->
    <script type="application/javascript" src="../../dist/sketch-thru-plan-sdk-bundle-min.js"></script>
    <!-- To use the PUBLISHED package instead of this repo's local build:
         <script src="https://cdn.jsdelivr.net/npm/sketch-thru-plan-sdk@0.6.17/dist/sketch-thru-plan-sdk-bundle-min.js"></script> -->
    <script type="application/javascript" src="../../plugins/speech/azurespeech-plugin/dist/stpazurespeech-bundle-min.js"></script>
    <!--<script type="application/javascript" src="../../plugins/speech/azurespeech-plugin/dist/stpazurespeech-bundle-min.js"></script>-->
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="actions">
      <label for="sessionId" class="group">Session:</label>
      <input type="text" id="sessionId" placeholder="auto">
      <input type="button" id="connect" value="Connect" />
      <label class="group">New COA:</label>
      <input type="text" id="coaName" placeholder="name">
      <select id="coaAffiliation">
        <option value="friend">friend</option>
        <option value="hostile">hostile</option>
      </select>
      <select id="coaRole">
        <option value="s2">s2</option>
        <option value="s3" selected>s3</option>
        <option value="s4">s4</option>
        <option value="fso">fso</option>
        <option value="engineer">engineer</option>
      </select>
      <input type="button" id="addCoa" value="Add" />
      <input type="button" id="importCoa" value="Import exported" class="group" />
      <input type="button" id="refresh" value="Refresh list" />
    </div>
    <div id="messages"></div>
    <div id="panel">
      <h3>Courses of Action</h3>
      <table>
        <thead><tr><th>Name</th><th>Affil.</th><th>Role</th><th></th></tr></thead>
        <tbody id="coaRows"></tbody>
      </table>
      <p>
        <label for="taskOrgs">Task org for the "Task org" button:</label>
        <select id="taskOrgs"></select>
      </p>
      <p>Task org in force: <b id="currentTo">none</b></p>
      <h3>COA events</h3>
      <div id="log"></div>
    </div>
    <div id="map">Connect to load map...</div>
    <script type="application/javascript" src="../../plugins/maps/leaflet/dist/leaflet-bundle-min.js"></script>
    <script type="application/javascript" src="../../plugins/renderers/milsymjs/dist/jmsrenderer-bundle-min.js"></script>
    <script src="index.js"></script>
   </body>
</html>
