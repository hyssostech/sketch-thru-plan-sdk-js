<!DOCTYPE html>
<html>
  <head>
    <title>Sketch-thru-Plan Edit Sample</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <!-- Speech recognition: Azure -->
    <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
    <!-- Speech recognition: AWS (bundles the AWS SDK) -->
    <script src="../../plugins/speech/awsspeech-plugin/dist/stpawsspeech-bundle-min.js"></script>
    <!-- Speech recognition: Vosk (offline, WASM) -->
    <script src="../../node_modules/vosk-browser/dist/vosk.js"></script>
    <script src="../../plugins/speech/voskspeech-plugin/dist/stpvoskspeech-bundle.js"></script>
    <!-- STP SDK and plugins -->
    <script type="application/javascript" src="../../dist/sketch-thru-plan-sdk-bundle-min.js"></script>
    <!-- To use the PUBLISHED package instead of this repo's local build:
         <script src="https://cdn.jsdelivr.net/npm/sketch-thru-plan-sdk@latest/dist/sketch-thru-plan-sdk-bundle-min.js"></script> -->
    <script src="../../plugins/speech/azurespeech-plugin/dist/stpazurespeech-bundle-min.js"></script>
    <!-- JMS renderer (bundles milsymbol + multipoint) -->
    <script src="../../plugins/renderers/milsymjs/dist/jmsrenderer-bundle-min.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <header class="toolbar">
      <div>
        <label for="mapSelector">Map:</label>
        <select id="mapSelector">
          <option value="gmaps">Google Maps</option>
          <option value="leaflet">Leaflet</option>
          <option value="arcgis">ArcGIS</option>
        </select>
      </div>
      <div>
        <label for="speechSelector">Speech:</label>
        <select id="speechSelector">
          <option value="azure">Azure</option>
          <option value="aws">AWS</option>
          <option value="vosk">Vosk (offline)</option>
        </select>
      </div>
      <div class="spacer"></div>
      <div id="status"></div>
    </header>

    <div id="messages"></div>
    <div id="map">Loading app...</div>

    <script src="index.js"></script>
  </body>
</html>
