# CodeQL static analysis (SAST) for the STP JavaScript/TypeScript SDK.
# STP-706: this repo previously had no SAST of any kind. hardened-ci.yml covers
# secrets, dependency CVEs and filesystem vulns; this workflow is the first to
# actually read the source for coding-defect classes (injection, XSS, unsafe
# regex, prototype pollution, etc).
#
# Public repo -> GitHub code scanning is free here (private engine repos need a
# paid Code Security seat; this one does not).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, not just on push/PR: a workflow that only runs on push stops
    # being evidence the moment the repo goes quiet (no commits does not mean
    # no new CodeQL query packs or newly-disclosed vuln patterns). Monday
    # 05:19 UTC - no other workflow in this repo declares a `schedule:`
    # trigger (checked via grep across .github/workflows/*.yml), so there is
    # nothing to collide with; the off-the-hour minute avoids the top-of-hour
    # scheduling crush GitHub documents for `schedule` events.
    - cron: '19 5 * * 1'

permissions:
  security-events: write   # required to upload SARIF results to code scanning
  actions: read             # required for the Action to read workflow run status
  contents: read             # required to check out the repository

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          # build-mode: none is the documented, GitHub-recommended mode for
          # javascript-typescript: JS/TS is an interpreted language, so the
          # CodeQL extractor reads .ts/.js source directly and does not need
          # a compiled or bundled artifact to analyze it. `npm run build`
          # here would only produce the rollup bundles under dist/ and
          # build/ that SCOPE DECISION (below) deliberately excludes as
          # noise, so running it would be wasted work, not a prerequisite.
          # The standalone github/codeql-action/autobuild action documents
          # itself as "only used for analyzing languages that require a
          # build" and points at build-mode instead, so it is intentionally
          # not used in this workflow.
          build-mode: none
          # ---------------------------------------------------------------
          # SCOPE DECISION (STP-706): analyze all hand-authored source -
          # src/, plugins/*/src/, samples/, quickstart/, test/, scripts/,
          # json-api/ - and exclude only generated/vendored/bundled output:
          #
          #   - **/dist/** and **/build/** - rollup bundles and tsc output
          #   - **/docs/** - TypeDoc output. Two plugins commit it today
          #     (websockets, azurespeech; 38 files), and each plugin's
          #     package.json builds it with `typedoc` and wipes it with
          #     `rimraf docs`, so it is generated by definition. No
          #     hand-written docs/ exists anywhere in this repo, so the
          #     glob cannot swallow real source; it is listed to stop the
          #     alert count growing silently as more plugins commit theirs.
          #     that every package under plugins/ commits alongside its
          #     src/. These are machine-derived duplicates of the source
          #     CodeQL already analyzes; scanning them finds the same
          #     issue twice (or a mangled, unfixable-at-that-path version
          #     of it after minification) and inflates the alert count
          #     without adding a single defect that isn't already visible
          #     in src/.
          #   - **/*min.js - minified bundles, wherever they land (most
          #     are already under dist/, but samples/basic ships a vendored
          #     copy - sketch-thru-plan-sdk-bundle-min.js - directly under
          #     samples/, outside any dist/build directory).
          #   - plugins/renderers/milsymjs/src/mil-sym-js.js - per its own
          #     header comment this ~120k-line file is machine-generated by
          #     an external Java `ant` build of the upstream mil-sym-js
          #     project and is Git-LFS-tracked in .gitattributes for that
          #     reason; it is vendored, not authored in this repo, and at
          #     that size would bury findings from every other path in this
          #     scan under CodeQL's own alert volume.
          #
          # Deliberately NOT scoped down to src/ only: samples/ and
          # quickstart/ are hand-written reference code that ships inside
          # this public repo and gets copy-pasted by SDK consumers, so a
          # real finding there (e.g. unsafe use of user input) is still
          # worth surfacing even though it does not carry the same weight
          # as the same class of finding inside the published SDK (src/,
          # plugins/*/src/). GitHub code scanning does not support
          # weighting alerts by directory within one workflow, and running
          # a second, differently-scoped workflow purely to reorder alerts
          # was judged not worth the added CI surface for a repo this size;
          # excluding the generated/vendored noise above is what actually
          # keeps signal from being buried.
          # ---------------------------------------------------------------
          config: |
            paths-ignore:
              - '**/dist/**'
              - '**/build/**'
              - '**/docs/**'
              - '**/*min.js'
              - 'plugins/renderers/milsymjs/src/mil-sym-js.js'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:javascript-typescript'
