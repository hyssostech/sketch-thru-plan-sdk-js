name: Publish SDK to npm

# Tag namespace RULED 2026-09-04: the SDK and the seven npm plugins version
# independently, so each publish workflow owns a distinct prefix. This one is
# 'sdk-v*'; the plugins workflow (.github/workflows/publish.yml) is 'plugins-v*'.
# A bare 'v*' must not be used by either - it would publish both at unrelated
# versions.
on:
  push:
    tags:
      - 'sdk-v*'
  # Rehearsal path (STP-736). This workflow had workflow_dispatch already,
  # but the publish step was a bare 'npm publish' - so dispatching it
  # published for real and there was no way to exercise it without cutting a
  # tag. Its entire history is two runs, both on sdk-v0.6.14, the first a
  # failure. It has succeeded exactly once.
  #
  # dry_run defaults to TRUE so a dispatch is safe by default. A tag push
  # leaves the input empty and publishes for real, unchanged.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing (leave true to rehearse)'
        required: false
        default: true
        type: boolean

# Workflow-level default is now the LEAST privilege, and id-token is granted
# only to the one job that publishes. It used to be granted here, which meant
# any job added later inherited the ability to mint a publish token unless
# someone remembered to override it - a footgun that only fires long after the
# person who set it has moved on. Both jobs below declare their own
# permissions, so this line is the safety net rather than the mechanism.
permissions:
  contents: read

# SPLIT INTO TWO JOBS ON PURPOSE - see githubactions:S6505.
#
# This used to be one job that held `id-token: write` and ran a bare `npm ci`.
# Those two facts together were the problem. `npm ci` executes preinstall,
# install and postinstall scripts from every dependency in the tree, and a job
# granted id-token gets ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN as ordinary
# environment variables visible to every process in it. So a lifecycle script
# in any transitive dependency could mint an OIDC token and publish this
# package to npm under the project's own identity, without going anywhere near
# the publish step below.
#
# Trusted Publishing removed the long-lived npm token, which was the right
# move, but the OIDC CAPABILITY is scoped to the whole job rather than to the
# publish command. The fix is to stop untrusted code and publish rights
# coexisting: build where there is no token, publish where there is no
# third-party code.
#
# What actually gates the original risk, stated honestly: `npm ci` installs
# from the lockfile with integrity hashes, so an attacker cannot alter an
# already-pinned version. The realistic window is a dependency BUMP that pulls
# in a version whose publisher was compromised - which is the shape of every
# large npm incident, and this repository takes grouped Dependabot updates.
jobs:
  # No id-token here. This job runs third-party install scripts and builds, and
  # deliberately has no credential worth stealing.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.pack.outputs.dist_tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.pack.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts even here, where there is no token to steal. Measured
      # before adopting it: exactly TWO installed packages declare a registry
      # install hook - bufferutil@4.1.0 and utf-8-validate@6.0.6, both
      # `node-gyp-build`, both native accelerators for ws reached through the
      # azurespeech plugin. ws wraps both requires in try/catch and continues
      # regardless, so skipping them costs a pure-JS fallback in a job that
      # opens no sockets.
      #
      # It also skips this package's own `prepare: npm run build`. That is not
      # a loss: the Build step below runs the same command explicitly, which is
      # better anyway - a build that happens visibly beats one hidden in an
      # install hook.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # WHAT A DRY RUN DOES NOT COVER, stated so nobody over-trusts it:
      # 'npm publish --dry-run' packs and reports the file list. It does NOT
      # authenticate against the registry, so it does NOT exercise the Trusted
      # Publishing policy - which is precisely what failed on 2026-09-04 (403,
      # 'Allowed actions' was stage-only). A green rehearsal says the build and
      # the packed contents are sound; it says nothing about whether the
      # publish is authorised. Check the npm Trusted Publisher policy BEFORE
      # tagging, not after.
      # STP-730. The dist-tag is DERIVED from the version, never hardcoded.
      #
      # A bare `npm publish` applies the `latest` dist-tag. That is correct for
      # a stable release and wrong for a release candidate: it would point every
      # `npm install sketch-thru-plan-sdk` at an rc. npm v11 refuses a bare
      # publish of a prerelease for exactly that reason - measured on 11.13.0:
      #
      #   1.0.0-rc.1, bare      -> exit 1, "You must specify a tag using --tag
      #                            when publishing a prerelease version."
      #   1.0.0-rc.1, --tag rc  -> exit 0, "with tag rc"
      #   1.0.0,      bare      -> exit 0, "with tag latest"
      #
      # So with package.json at 0.6.15-rc.1 this step FAILS without a --tag.
      #
      # Hardcoding `--tag rc` would fix that and create the opposite trap: the
      # later STABLE publish would land on the rc dist-tag, leaving `latest`
      # pointing at the old version, and someone would have to remember to
      # change it back. Deriving from the version is correct in BOTH directions
      # with no second edit, and `--tag latest` is identical to a bare publish.
      #
      # The identifier is taken from the version rather than assumed, so
      # 0.6.15-beta.2 publishes under `beta`, not under `rc`.
      # Pack HERE rather than in the publish job, so what gets published is the
      # artifact this job built and tested - not a re-resolution of the
      # dependency tree inside a job that holds a token.
      #
      # The dist-tag is derived here too, because deriving it needs
      # package.json and the publish job deliberately has no checkout.
      - name: Pack the tarball and derive the dist-tag
        id: pack
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) PRERELEASE="${VERSION#*-}"; DIST_TAG="${PRERELEASE%%.*}" ;;
            *)   DIST_TAG="latest" ;;
          esac

          # A malformed identifier must stop the publish, not silently become a
          # junk dist-tag that consumers can never find.
          case "$DIST_TAG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::refusing to publish: derived dist-tag '$DIST_TAG' from version '$VERSION' is not a usable npm tag"
              exit 1 ;;
          esac

          echo "version=$VERSION -> dist-tag=$DIST_TAG"

          TARBALL="$(npm pack --silent)"
          echo "packed: $TARBALL"

          # THE GUARD THAT REPLACES prepublishOnly.
          #
          # Publishing a pre-packed tarball runs no lifecycle scripts, so the
          # `prepublishOnly: npm run build` net that used to stand behind the
          # explicit Build step is gone. Without something here, deleting the
          # Build step would publish an unbuilt package with every check green.
          # This asserts the packed artifact actually carries the built output.
          if ! tar -tzf "$TARBALL" | grep -q '^package/dist/'; then
            echo "::error::the packed tarball contains no dist/ - refusing to publish an unbuilt package"
            tar -tzf "$TARBALL" | head -20
            exit 1
          fi
          echo "dist/ present in the tarball:"
          tar -tzf "$TARBALL" | grep '^package/dist/' | head -5

          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "tarball=$TARBALL"
          } >>"$GITHUB_OUTPUT"

      - name: Upload the packed tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # The ONLY job with id-token. No checkout, and it never runs npm ci, so no
  # third-party code executes while the OIDC capability is available. It
  # publishes the exact bytes the build job packed and tested.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball

      # WHAT A DRY RUN DOES NOT COVER, stated so nobody over-trusts it:
      # 'npm publish --dry-run' packs and reports the file list. It does NOT
      # authenticate against the registry, so it does NOT exercise the Trusted
      # Publishing policy - which is precisely what failed on 2026-09-04 (403,
      # 'Allowed actions' was stage-only). A green rehearsal says the build and
      # the packed contents are sound; it says nothing about whether the publish
      # is authorised. Check the npm Trusted Publisher policy BEFORE tagging.
      #
      # STP-730. The dist-tag is DERIVED from the version, never hardcoded. A
      # bare `npm publish` applies `latest`, correct for a stable release and
      # wrong for a release candidate - it would point every
      # `npm install sketch-thru-plan-sdk` at an rc. npm v11 refuses a bare
      # publish of a prerelease for that reason (measured on 11.13.0).
      # Hardcoding `--tag rc` inverts the trap, so it is derived in the build
      # job and carried here as an output.
      #
      # --ignore-scripts is deliberately NOT passed here: publishing a tarball
      # runs no lifecycle scripts anyway, and the flag would falsely imply that
      # some were being suppressed.
      - name: Publish to npm (Trusted Publishing)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          test -f "$TARBALL" || { echo "::error::packed tarball $TARBALL not found"; ls -la; exit 1; }
          echo "version=$VERSION -> dist-tag=$DIST_TAG   artifact=$TARBALL"

          # Empty on a tag push (no inputs context), so a tag publishes for real.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo 'REHEARSAL: --dry-run, nothing will be published.'
            npm publish "$TARBALL" --access public --tag "$DIST_TAG" --dry-run
          else
            npm publish "$TARBALL" --access public --tag "$DIST_TAG"
          fi
