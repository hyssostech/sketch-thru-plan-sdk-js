name: Publish SDK to npm

# DISARMED pending a ruling on the tag namespace.
# .github/workflows/publish.yml ALREADY fires on 'v*' and publishes the seven
# npm plugins. If this workflow also took 'v*', a single tag would publish both
# the SDK and the plugins, at unrelated versions. Decide the scheme first -
# distinct prefixes ('sdk-v*' vs 'plugins-v*'), or one workflow with two jobs -
# then restore the push trigger. Manual-only until then.
on:
  workflow_dispatch:

permissions:
  id-token: write      # required for npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public
