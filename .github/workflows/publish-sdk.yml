name: Publish SDK to npm

# Tag namespace RULED 2026-09-04: the SDK and the seven npm plugins version
# independently, so each publish workflow owns a distinct prefix. This one is
# 'sdk-v*'; the plugins workflow (.github/workflows/publish.yml) is 'plugins-v*'.
# A bare 'v*' must not be used by either - it would publish both at unrelated
# versions.
on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

permissions:
  id-token: write      # required for npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public
