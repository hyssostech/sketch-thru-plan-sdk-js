name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      # The bundled Vosk model is built in the STP engine repo and copied
      # here; nothing used to compare the two copies against each other or
      # against what the engine actually built, and they had silently
      # drifted apart and fallen months behind (Jira STP-683). This reads
      # the LFS pointers rather than the blobs, so it costs no LFS
      # bandwidth and needs no dependencies - hence its place before npm ci.
      - name: Verify bundled speech model
        run: npm run verify:speech-model
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # STP-760. The step above is `tsc` over a tsconfig whose include list is
      # `src` only, so a green build-and-test proved the SDK compiled and
      # NOTHING ELSE. All 11 declared workspaces - the six published plugins,
      # two private renderers, the quickstart and two samples - went unbuilt.
      #
      # That is not academic. samples/basic loads
      # plugins/maps/{arcgis,googlemaps,leaflet}/dist/*-bundle-min.js at
      # runtime, and the publish workflow packs what these builds produce. Two
      # plugins shipped to npm with NO dist/ at all (STP-742) and nothing
      # compared built to packed, because nothing built them here.
      #
      # RULING 2026-09-12: samples are product, even if not packaged. So the
      # gate covers every declared workspace, not just the published ones.
      #
      # Measured before wiring this: all 11 build clean on origin/main, so the
      # gate lands green rather than red-on-arrival. A gate that is red the day
      # it ships is one somebody switches off - that is how the engine ended up
      # with a quality gate evaluating zero conditions (STP-741).
      - name: Build every declared workspace
        run: |
          set -euo pipefail

          # Derive the list from package.json rather than restating it, so the
          # gate cannot drift from the manifest it claims to cover.
          mapfile -t workspaces < <(node -e '
            const {execSync} = require("child_process");
            const out = execSync("npm query .workspace", {encoding:"utf8"});
            for (const w of JSON.parse(out)) console.log(w.location);
          ')

          built=0
          for w in "${workspaces[@]}"; do
            echo "--- building $w"
            npm run build --workspace "$w" --if-present
            built=$((built + 1))
          done

          # A gate that examined NOTHING is a broken instrument, not a pass.
          # If the query above ever returns empty this step would otherwise
          # succeed loudly while building nothing at all.
          if [ "$built" -eq 0 ]; then
            echo "::error::built ZERO workspaces - the workspace query returned nothing, so this check measured nothing."
            exit 1
          fi
          echo "PASS: built $built declared workspace(s)."

      - name: Test
        run: npm test

      # STP-742. The plugin pack gate has its own unit tests, driven by
      # synthetic payloads - one of which reproduces exactly what
      # @hyssostech/arcgis-plugin@0.1.2 shipped to npm with no dist/. Running
      # them here means the gate's failure modes are re-proven on every PR
      # rather than once, by hand, at the time it was written.
      - name: Test the plugin pack gate
        run: node .github/scripts/tests/test-assert-plugin-pack.mjs

      # STP-728. STP-707 SHA-pinned every action; nothing enforced it, so a
      # `uses: foo@v1` would merge green and the convention would decay. It
      # already had: main carried a version comment wrong by THREE majors.
      # STP-754. Twelve sample pages loaded Microsoft's speech SDK from
      # `@latest` with no integrity attribute - whatever the CDN served that day
      # executed unverified in a page users are invited to run.
      #
      # Offline on purpose. The hashes were verified against live bytes once,
      # when they were authored (21 attributes, re-fetched on a second
      # connection to prove the CDN is byte-stable for a pinned version). A gate
      # that reaches the network on every run goes red on a CDN hiccup, and a
      # gate that cries wolf gets switched off. This asserts the structure,
      # which is what regresses: a new script tag, unpinned or unhashed.
      - name: Assert CDN subresources are pinned and carry SRI
        run: node .github/scripts/assert-cdn-pinned-and-sri.mjs .

      # The check must be able to FAIL. sdk-js PR #62 shipped a WRONG SRI hash,
      # which does not error a build - it just makes the browser refuse the
      # script - so "it passed" is worth nothing without showing it can reject.
      - name: Test the CDN pin/SRI check
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/pages"

          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/some-pkg@latest/x.js"></script>
          HTML
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check ACCEPTED an @latest script - it is not gating."
            exit 1
          fi

          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/some-pkg@1.2.3/x.js"></script>
          HTML
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check ACCEPTED a pinned script with no integrity."
            exit 1
          fi

          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/some-pkg@1.2.3/x.js" integrity="sha384-AAAA" crossorigin="anonymous"></script>
          HTML
          if ! node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check REJECTED a correctly pinned+hashed script."
            exit 1
          fi

          rm -rf "$tmp"
          echo "PASS: the CDN check rejects unpinned and unhashed subresources, and accepts a good one."

      - name: Assert actions are SHA-pinned
        run: node .github/scripts/assert-action-pins.mjs .github/workflows

      - name: Test the action pin check
        run: node .github/scripts/tests/test-assert-action-pins.mjs
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage
          if-no-files-found: warn
