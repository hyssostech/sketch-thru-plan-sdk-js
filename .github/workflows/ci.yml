name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      # The bundled Vosk model is built in the STP engine repo and copied
      # here; nothing used to compare the two copies against each other or
      # against what the engine actually built, and they had silently
      # drifted apart and fallen months behind (Jira STP-683). This reads
      # the LFS pointers rather than the blobs, so it costs no LFS
      # bandwidth and needs no dependencies - hence its place before npm ci.
      - name: Verify bundled speech model
        run: npm run verify:speech-model
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage
          if-no-files-found: warn
