name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      # The bundled Vosk model is built in the STP engine repo and copied
      # here; nothing used to compare the two copies against each other or
      # against what the engine actually built, and they had silently
      # drifted apart and fallen months behind (Jira STP-683). This reads
      # the LFS pointers rather than the blobs, so it costs no LFS
      # bandwidth and needs no dependencies - hence its place before npm ci.
      - name: Verify bundled speech model
        run: npm run verify:speech-model
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # STP-760. The step above is `tsc` over a tsconfig whose include list is
      # `src` only, so a green build-and-test proved the SDK compiled and
      # NOTHING ELSE. All 11 declared workspaces - the six published plugins,
      # two private renderers, the quickstart and two samples - went unbuilt.
      #
      # That is not academic. samples/basic loads
      # plugins/maps/{arcgis,googlemaps,leaflet}/dist/*-bundle-min.js at
      # runtime, and the publish workflow packs what these builds produce. Two
      # plugins shipped to npm with NO dist/ at all (STP-742) and nothing
      # compared built to packed, because nothing built them here.
      #
      # RULING 2026-09-12: samples are product, even if not packaged. So the
      # gate covers every declared workspace, not just the published ones.
      #
      # Measured before wiring this: all 11 build clean on origin/main, so the
      # gate lands green rather than red-on-arrival. A gate that is red the day
      # it ships is one somebody switches off - that is how the engine ended up
      # with a quality gate evaluating zero conditions (STP-741).
      - name: Build every declared workspace
        run: |
          set -euo pipefail

          # Derive the list from package.json rather than restating it, so the
          # gate cannot drift from the manifest it claims to cover.
          mapfile -t workspaces < <(node -e '
            const {execSync} = require("child_process");
            const out = execSync("npm query .workspace", {encoding:"utf8"});
            for (const w of JSON.parse(out)) console.log(w.location);
          ')

          built=0
          for w in "${workspaces[@]}"; do
            echo "--- building $w"
            npm run build --workspace "$w" --if-present
            built=$((built + 1))
          done

          # A gate that examined NOTHING is a broken instrument, not a pass.
          # If the query above ever returns empty this step would otherwise
          # succeed loudly while building nothing at all.
          if [ "$built" -eq 0 ]; then
            echo "::error::built ZERO workspaces - the workspace query returned nothing, so this check measured nothing."
            exit 1
          fi
          echo "PASS: built $built declared workspace(s)."

      - name: Test
        run: npm test

      # STP-742. The plugin pack gate has its own unit tests, driven by
      # synthetic payloads - one of which reproduces exactly what
      # @hyssostech/arcgis-plugin@0.1.2 shipped to npm with no dist/. Running
      # them here means the gate's failure modes are re-proven on every PR
      # rather than once, by hand, at the time it was written.
      - name: Test the plugin pack gate
        run: node .github/scripts/tests/test-assert-plugin-pack.mjs

      # STP-728. STP-707 SHA-pinned every action; nothing enforced it, so a
      # `uses: foo@v1` would merge green and the convention would decay. It
      # already had: main carried a version comment wrong by THREE majors.
      # STP-754. Twelve sample pages loaded Microsoft's speech SDK from
      # `@latest` with no integrity attribute - whatever the CDN served that day
      # executed unverified in a page users are invited to run.
      #
      # Offline on purpose. The hashes were verified against live bytes once,
      # when they were authored (21 attributes, re-fetched on a second
      # connection to prove the CDN is byte-stable for a pinned version). A gate
      # that reaches the network on every run goes red on a CDN hiccup, and a
      # gate that cries wolf gets switched off. This asserts the structure,
      # which is what regresses: a new script tag, unpinned or unhashed.
      - name: Assert CDN subresources are pinned and carry SRI
        run: node .github/scripts/assert-cdn-pinned-and-sri.mjs .

      # The check must be able to FAIL. sdk-js PR #62 shipped a WRONG SRI hash,
      # which does not error a build - it just makes the browser refuse the
      # script - so "it passed" is worth nothing without showing it can reject.
      - name: Test the CDN pin/SRI check
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/pages"

          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/some-pkg@latest/x.js"></script>
          HTML
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check ACCEPTED an @latest script - it is not gating."
            exit 1
          fi

          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/some-pkg@1.2.3/x.js"></script>
          HTML
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check ACCEPTED a pinned script with no integrity."
            exit 1
          fi

          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://cdn.jsdelivr.net/npm/some-pkg@1.2.3/x.js" integrity="sha384-AAAA" crossorigin="anonymous"></script>
          HTML
          if ! node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check REJECTED a correctly pinned+hashed script."
            exit 1
          fi

          # THE REGRESSION THAT ACTUALLY HAPPENED. This check used to filter by a
          # four-host allowlist before doing anything else, so a subresource
          # from any other origin was skipped in silence - js.arcgis.com was
          # serving four of them with no integrity attribute at all while this
          # script reported "every third-party CDN subresource is pinned and
          # carries SRI". SonarQube found what the gate could not.
          #
          # An allowlist is the wrong shape here: a script tag from a NEW origin
          # is precisely the event worth catching, and an allowlist is quiet
          # exactly then. This control fails if scope is ever narrowed again.
          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://totally-new-origin.example.com/x.js"></script>
          HTML
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check IGNORED a subresource from an unlisted host."
            echo "::error::Scope has been narrowed to an allowlist again - that is the bug this control exists for."
            exit 1
          fi

          # And the companion: a runtime loader is legitimately exempt from SRI
          # (the hash would cover the loader, not what it fetches) but must
          # still be version-pinned, and must not drag everything served under
          # its path into the exemption. That second half was a real bug: the
          # exemption regex lacked an end anchor, so a stylesheet under the
          # loader's version path was silently exempted as if it were a loader.
          cat >"$tmp/pages/unpinned.html" <<'HTML'
          <script src="https://js.arcgis.com/4.29/"></script>
          <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
          HTML
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp" >/dev/null 2>&1; then
            echo "::error::the check EXEMPTED a stylesheet served under a loader's path."
            echo "::error::The loader exemption must match the loader URL only."
            exit 1
          fi

          # THE SECOND BLIND SPOT, and the one that let a floating range live in
          # the primary demo sample through the whole of STP-754. These loads are
          # created from JavaScript at runtime rather than declared as tags, so a
          # scanner that parses HTML only cannot see them at all.
          mkdir -p "$tmp/dyn"
          cat >"$tmp/dyn/a.js" <<'JS'
          loadScript("https://unpkg.com/@googlemaps/js-api-loader@1.x/dist/index.min.js");
          JS
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp/dyn" >/dev/null 2>&1; then
            echo "::error::the check IGNORED a FLOATING version in a dynamic loadScript()."
            echo "::error::Scope has been narrowed back to HTML tags - that is the bug this control exists for."
            exit 1
          fi

          cat >"$tmp/dyn/a.js" <<'JS'
          loadScript("https://cdn.jsdelivr.net/npm/pkg@1.2.3/x.js");
          JS
          if node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp/dyn" >/dev/null 2>&1; then
            echo "::error::the check ACCEPTED a dynamic load carrying no integrity digest."
            exit 1
          fi

          cat >"$tmp/dyn/a.js" <<'JS'
          loadScript("https://cdn.jsdelivr.net/npm/pkg@1.2.3/x.js",
            "sha384-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA");
          JS
          if ! node .github/scripts/assert-cdn-pinned-and-sri.mjs "$tmp/dyn" >/dev/null 2>&1; then
            echo "::error::the check REJECTED a correctly pinned dynamic load carrying a digest."
            exit 1
          fi

          rm -rf "$tmp"
          echo "PASS: the CDN check rejects unpinned and unhashed subresources in BOTH"
          echo "      tags and dynamic loadScript() calls, gates unlisted origins, scopes"
          echo "      the loader exemption to the loader itself, and accepts a good one."

      - name: Assert actions are SHA-pinned
        run: node .github/scripts/assert-action-pins.mjs .github/workflows

      - name: Test the action pin check
        run: node .github/scripts/tests/test-assert-action-pins.mjs

      # STP-709. scripts/release-manifest.sh is what makes SHA256SUMS a claim
      # about the PUBLISHED asset set rather than about whatever happened to be
      # on disk when it was written - and it shipped with no tests, in both
      # SDKs, which made the central release-integrity control of each one a
      # thing taken on trust.
      #
      # The load-bearing case is a file present in the release directory but
      # absent from the manifest. `sha256sum -c` walks the manifest and so
      # cannot see it, and that exact state occurs on EVERY release the moment
      # attestations.jsonl is copied in after the manifest is generated. One of
      # the controls asserts that `sha256sum -c` STILL fails to catch it, so the
      # reason this script exists cannot quietly evaporate.
      - name: Test the release manifest gate
        run: bash .github/scripts/tests/test-release-manifest.sh

      # githubactions:S6505. `npm ci` runs preinstall/install/postinstall scripts
      # from every dependency; a job with id-token: write exposes
      # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN to every process in it. Together, a
      # lifecycle script in any transitive dependency can mint an OIDC token and
      # publish under this project's identity without touching the publish step.
      #
      # Both publish workflows were split by hand so that never happens. Nothing
      # stopped the next person merging the jobs back for convenience, or adding
      # an `npm ci` to the publish job to get a tool on PATH - both entirely
      # reasonable-looking changes that silently restore the problem. This makes
      # it a property the repository keeps rather than two one-off fixes.
      - name: Assert no job installs dependencies while privileged
        run: node .github/scripts/assert-no-privileged-install.mjs .github/workflows

      - name: Test the privileged-install check
        run: node .github/scripts/tests/test-assert-no-privileged-install.mjs

      # STP-698 / STP-700 parity. The .NET sibling shipped 0.6.0-rc.1 to
      # nuget.org while every document in the repository still said 0.5.0. The
      # same defect is here, quieter because it is in the plugins: two published
      # speech plugins carried a CHANGELOG.md that topped out one and two
      # versions behind what npm was serving - and both ship that file INSIDE
      # the tarball, verified by downloading them, so a consumer reading the
      # changelog for the version they installed found no mention of it.
      #
      # Scoped narrowly on purpose. Only published packages, and only ones that
      # already HAVE a changelog: four published plugins have none at all, which
      # is arguably worse, but requiring one is a process decision for the owner
      # and a gate that invents process is a gate that gets disabled. This
      # enforces something unarguable - a changelog that exists must not lie.
      - name: Assert every changelog names the version it ships with
        run: node .github/scripts/assert-changelog-matches-version.mjs .

      - name: Test the changelog-agreement check
        run: node .github/scripts/tests/test-assert-changelog-matches-version.mjs
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage
          if-no-files-found: warn
