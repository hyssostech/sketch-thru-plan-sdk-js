name: Publish plugins to npm

on:
  push:
    tags:
      # Plugins version independently of the SDK - see publish-sdk.yml.
      # A shared 'v*' would publish both at unrelated versions.
      - 'plugins-v*'

  # STP-736 parity. publish-sdk.yml got a rehearsal switch and this file did
  # not, which left the plugins publish with no way to exercise it short of a
  # real tag that really publishes six packages. That gap mattered more here
  # than there: this path has fired twice - v0.1.0-alpha.2 and v0.1.0-alpha.3,
  # March 2026, under the old bare 'v*' trigger - and FAILED BOTH TIMES. It
  # has never succeeded once.
  #
  # dry_run defaults TRUE, so a bare dispatch rehearses and publishes nothing.
  # A tag push leaves inputs.dry_run empty, which the step below reads as
  # false, so the tag path is completely unchanged.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only: pack and validate, publish nothing.'
        type: boolean
        default: true

# Workflow-level default is LEAST PRIVILEGE. id-token is granted only to the one
# job that publishes. It used to be granted here, which meant any job added
# later inherited the ability to mint a publish token unless someone remembered
# to override it - a footgun that only fires long after whoever set it moved on.
permissions:
  contents: read

# SPLIT INTO TWO JOBS ON PURPOSE - githubactions:S6505, ported from
# publish-sdk.yml where the same split was proven end-to-end by a real rc
# publish (0.6.16-rc.1) that came back carrying its SLSA provenance.
#
# This used to be one job holding `id-token: write` and running a bare
# `npm ci`. Those two facts together were the problem. `npm ci` executes
# preinstall/install/postinstall scripts from every dependency in the tree, and
# a job granted id-token gets ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN as
# ordinary environment variables visible to every process in it. So a lifecycle
# script in any transitive dependency could mint an OIDC token and publish any
# of these six packages under the project's identity, never touching the
# publish step.
#
# Trusted Publishing removed the long-lived token, which was right, but the
# OIDC capability is scoped to the JOB, not to the publish command. So: build
# where there is no token, publish where there is no third-party code.
jobs:
  # No id-token. Runs third-party install scripts and builds; has no credential
  # worth stealing.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package:
          - plugins/speech/azurespeech-plugin
          - plugins/speech/awsspeech-plugin
          - plugins/speech/voskspeech-plugin
          - plugins/maps/leaflet
          - plugins/maps/arcgis
          - plugins/maps/googlemaps

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # STP-723. These three steps used to run with
      # working-directory: ${{ matrix.package }} and `npm install`.
      #
      # That was correct while each plugin owned a package-lock.json. Once the
      # root package.json declares workspaces (STP-698) and the nine per-plugin
      # lockfiles are deleted, `npm install` from inside a member resolves at
      # the WORKSPACE ROOT, and - measured, not assumed - it does so silently:
      #
      #   npm install inside a plugin directory
      #     -> exit 0, creates node_modules at the REPO ROOT (228 packages),
      #        none in the plugin directory.
      #   With package.json deliberately desynced from the lockfile
      #     -> STILL exit 0, and it MUTATED the root package-lock.json.
      #   npm ci at the root, same desync
      #     -> exit 1, EUSAGE, naming the desync.
      #
      # So the old shape would let a release tag re-resolve dependencies,
      # rewrite the lockfile inside the runner's checkout, and publish a
      # tarball built from a tree that no lockfile in the repository
      # describes - without ever failing. `npm ci` is the whole fix: it
      # refuses to proceed when package.json and the lockfile disagree.
      #
      # Verified equivalent before changing: building and packing via
      # --workspace produced a byte-identical file list to the old
      # working-directory form - 28 files, 60.2 kB, 330.2 kB unpacked. That
      # measurement was taken on @hyssostech/websockets-plugin, which STP-698
      # has since RETIRED: the fork duplicated the SDK's own connector, its
      # entire difference was the missing updateSolvables, and nothing in the
      # repo used it.
      #
      # Its matrix entry is removed above. Leaving it would fail the publish
      # job on a missing directory at the next plugins-v* tag - the deletion
      # landed on the convention branch while this file lists the packages.
      #
      # --workspace accepts the PATH form that matrix.package holds, so the
      # six remaining entries need no other change.
      # --ignore-scripts: measured across 6,347 installed packages, exactly TWO
      # declare a registry install hook - bufferutil and utf-8-validate, both
      # `node-gyp-build`, both optional native accelerators for ws reached
      # through the azurespeech plugin. ws wraps both requires in try/catch and
      # continues regardless, so skipping them costs a pure-JS fallback in a job
      # that opens no sockets.
      #
      # It also skips the root package's own `prepare: npm run build`, which is
      # not a loss - the Build step below runs the same command explicitly, and
      # a build that happens visibly beats one hidden in an install hook.
      #
      # NOT passed to `npm publish`: every plugin declares
      # `prepublishOnly: npm run build`, so suppressing scripts there would ship
      # an unbuilt package.
      - name: Install dependencies (root, deterministic)
        run: npm ci --ignore-scripts

      # EVERY plugin compiles against the root SDK - each declares
      # "sketch-thru-plan-sdk": "file:../../.." - so the SDK's type declarations
      # must exist before any plugin's tsc runs.
      #
      # This step is NEW, and it is here because --ignore-scripts exposed that
      # the build was previously happening by ACCIDENT. `npm ci` used to run the
      # root package's `prepare: npm run build` hook, which built the SDK as a
      # side effect of installing. Nothing in this workflow said so, nothing
      # depended on it explicitly, and suppressing install scripts broke all six
      # plugins at once with
      #
      #     error TS2307: Cannot find module 'sketch-thru-plan-sdk'
      #
      # That is precisely the argument for preferring an explicit build over one
      # hidden in a lifecycle hook: the hook worked right up until something
      # unrelated stopped invoking it, and then the failure named a missing
      # module rather than a missing step.
      - name: Build the SDK that every plugin compiles against
        run: npm run build

      - name: Build
        run: npm run build --workspace ${{ matrix.package }}

      # STP-741. Nothing compared what was BUILT to what gets PACKED, and on
      # 2026-09-11 that shipped two plugins containing no dist/ at all - the
      # build wrote it, the ignore rules dropped it at pack time because those
      # packages declared no "files" array, and every signal stayed green:
      # build OK, publish OK, workflow green, "+ @hyssostech/arcgis-plugin@0.1.2".
      #
      # This runs BEFORE the publish so a package that does not contain its own
      # code cannot reach the registry. npm has no delete, so catching it here
      # is the only place it can be caught.
      - name: Assert the tarball contains the built output
        run: node .github/scripts/assert-plugin-pack.mjs ${{ matrix.package }}

      # Pack HERE so the bytes that get published are the ones this job built and
      # checked, rather than a re-resolution of the tree inside a job that holds
      # a token. npm pack --workspace writes the tarball to the repo root and
      # prints only its filename - verified, not assumed.
      - name: Pack the tarball
        id: pack
        env:
          PKG_DIR: ${{ matrix.package }}
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./$PKG_DIR/package.json').name")"
          VERSION="$(node -p "require('./$PKG_DIR/package.json').version")"
          TARBALL="$(npm pack --workspace "$PKG_DIR" --silent | tr -d '\r')"
          test -f "$TARBALL" || { echo "::error::npm pack produced no $TARBALL"; ls -la; exit 1; }

          mkdir -p staged
          mv "$TARBALL" staged/
          # Metadata travels WITH the tarball. A matrix job cannot set per-entry
          # job outputs - later entries overwrite earlier ones - so the publish
          # job reads what it needs out of the artifact instead.
          {
            echo "NAME=$NAME"
            echo "VERSION=$VERSION"
            echo "TARBALL=$TARBALL"
          } >staged/meta.env

          # Artifact names cannot contain '/', and the matrix entries are paths.
          echo "slug=${PKG_DIR//\//-}" >>"$GITHUB_OUTPUT"
          echo "packed $NAME@$VERSION -> $TARBALL"

      - name: Upload the packed tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ steps.pack.outputs.slug }}
          path: staged/
          if-no-files-found: error
          retention-days: 1

  # The ONLY job with id-token. No checkout, no npm ci, so no third-party code
  # runs while the OIDC capability is available.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package:
          - plugins/speech/azurespeech-plugin
          - plugins/speech/awsspeech-plugin
          - plugins/speech/voskspeech-plugin
          - plugins/maps/leaflet
          - plugins/maps/arcgis
          - plugins/maps/googlemaps

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Derive the artifact name
        id: slug
        env:
          PKG_DIR: ${{ matrix.package }}
        run: echo "slug=${PKG_DIR//\//-}" >>"$GITHUB_OUTPUT"

      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-${{ steps.slug.outputs.slug }}

      # --dry-run exercises pack, the file list and the registry's metadata
      # validation. It does NOT exercise the Trusted Publishing policy: no
      # OIDC token is redeemed, so a missing or wrong connection for any of
      # these six packages still passes here and fails on the real tag.
      #
      # STP-742. This tag publishes a SET of six packages that version
      # INDEPENDENTLY by design, so any given tag will usually carry changes to
      # only some of them. Without the check below, every unchanged package
      # fails on "cannot publish over the previously published version" and the
      # run goes red while having done exactly the right thing. That is a red
      # nobody can act on, which is how real reds get ignored.
      #
      # The skip is decided by a POSITIVE lookup - "the registry already serves
      # this exact name@version" - never by swallowing a publish error. That
      # distinction is the whole point: `dotnet nuget push --skip-duplicate`
      # exits 0 having shipped nothing and is indistinguishable from success,
      # and this must not become that.
      #
      # It also prints SKIPPED vs PUBLISHED explicitly, so a green run says
      # which of the two happened rather than leaving them to look alike.
      - name: Publish to npm (Trusted Publishing)
        id: pub
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          test -f meta.env || { echo "::error::meta.env missing from the artifact"; ls -la; exit 1; }
          # shellcheck disable=SC1091
          . ./meta.env
          echo "package: $NAME@$VERSION   artifact: $TARBALL"
          test -f "$TARBALL" || { echo "::error::$TARBALL missing from the artifact"; ls -la; exit 1; }

          # Positive check. `npm view <name>@<version> version` prints the
          # version only when that exact version exists; anything else (missing
          # package, missing version, network failure) leaves EXISTING empty and
          # we fall through to publishing, where npm is the authority.
          EXISTING="$(npm view "$NAME@$VERSION" version 2>/dev/null | tr -d '\r' || true)"

          if [ "$EXISTING" = "$VERSION" ]; then
            echo "SKIPPED: $NAME@$VERSION is already on the registry - this package did not change in this release."
            echo "published=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo 'REHEARSAL: --dry-run, nothing will be published.'
            npm publish "$TARBALL" --access public --dry-run
            echo "published=false" >>"$GITHUB_OUTPUT"
          else
            npm publish "$TARBALL" --access public
            echo "PUBLISHED: $NAME@$VERSION"
            echo "published=true" >>"$GITHUB_OUTPUT"
            echo "spec=$NAME@$VERSION" >>"$GITHUB_OUTPUT"
          fi

      # THE ONLY QUIET FAILURE HERE, made loud - same reasoning as
      # publish-sdk.yml. `--provenance` is never passed; npm auto-enables it
      # under Trusted Publishing. If it ever stops being attached the package
      # publishes perfectly, every step stays green, and the SLSA attestation
      # VERIFYING.md tells consumers to check is simply absent.
      #
      # Only runs when this matrix entry actually published, so a SKIPPED
      # package is not asserted against.
      - name: Assert the published version carries provenance
        if: steps.pub.outputs.published == 'true'
        env:
          SPEC: ${{ steps.pub.outputs.spec }}
        run: |
          set -euo pipefail
          echo "checking provenance for $SPEC"

          PREDICATE=''
          for attempt in $(seq 1 10); do
            PREDICATE="$(npm view "$SPEC" dist.attestations.provenance.predicateType 2>/dev/null | tr -d '\r' || true)"
            if [ -n "$PREDICATE" ]; then
              echo "attempt $attempt: $PREDICATE"
              break
            fi
            echo "attempt $attempt: not visible yet, waiting"
            sleep 15
          done

          if [ -z "$PREDICATE" ]; then
            echo "::error::$SPEC published WITHOUT a provenance attestation, or it did"
            echo "::error::not become visible within ~150s. Before calling this a flake:"
            echo "::error::  npm view $SPEC dist.attestations --json"
            exit 1
          fi

          case "$PREDICATE" in
            https://slsa.dev/provenance/*) echo "provenance present: $PREDICATE" ;;
            *) echo "::error::unexpected predicateType '$PREDICATE'"; exit 1 ;;
          esac
