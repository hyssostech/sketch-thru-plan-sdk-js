name: Publish plugins to npm

on:
  push:
    tags:
      # Plugins version independently of the SDK - see publish-sdk.yml.
      # A shared 'v*' would publish both at unrelated versions.
      - 'plugins-v*'

permissions:
  id-token: write      # required for npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package:
          - plugins/connectors/websockets-plugin
          - plugins/speech/azurespeech-plugin
          - plugins/speech/awsspeech-plugin
          - plugins/speech/voskspeech-plugin
          - plugins/maps/leaflet
          - plugins/maps/arcgis
          - plugins/maps/googlemaps

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm install

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

      - name: Publish to npm (Trusted Publishing)
        working-directory: ${{ matrix.package }}
        run: npm publish --access public
