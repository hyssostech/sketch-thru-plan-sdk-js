# ═══════════════════════════════════════════════════════════════════════
# Hardened CI Pipeline — Security scanning for the STP JavaScript SDK
# ═══════════════════════════════════════════════════════════════════════
# Runs on every push and PR to main.  Provides:
#   • Secret scanning          — Gitleaks detects committed credentials
#   • Dependency review        — gates PRs on new vulnerable dependencies
#   • npm audit                — checks installed packages for known CVEs
#   • Vulnerability scanning   — Trivy cross-checks against NVD/GHSA
#
# Build and test are handled by ci.yml — this workflow focuses on
# security checks that ci.yml does not cover.
#
# Actions are SHA-pinned for supply chain integrity.
# ═══════════════════════════════════════════════════════════════════════

name: Hardened CI

on:
  push:
    branches: [main]
    # Tag namespace RULED 2026-09-04: the SDK and the seven npm plugins
    # version independently, each with its own release-tag prefix (see
    # publish-sdk.yml and publish.yml). A bare 'v*' belongs to neither
    # namespace and never matches, so list both real prefixes here.
    tags: ['sdk-v*', 'plugins-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Secret Scanning (Gitleaks) ────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VER="8.24.3"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks — secret scanning
        run: |
          gitleaks detect \
            --source . \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --exit-code 1
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore

  # ─── Dependency Review (PR only) ───────────────────────────────────
  # Blocks PRs that introduce dependencies with known HIGH+ CVEs.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ─── Security Scan ─────────────────────────────────────────────────
  # Installs dependencies and runs npm audit + Trivy filesystem scan.
  # Build and test coverage are handled by ci.yml.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── npm audit ──────────────────────────────────────────────────
      - name: npm audit — dependency vulnerability check
        run: npm audit --audit-level=high

      # ── Trivy vulnerability scanning ───────────────────────────────
      # Cross-references package-lock.json against NVD and GitHub
      # Security Advisories.  Catches CVEs that npm audit may miss.
      - name: Trivy — dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          # SCOPE LIMIT, STATED DELIBERATELY: this job does not check out LFS
          # content, so the fs scan walks a 133-byte pointer where
          # plugins/speech/voskspeech-plugin/model/vosk-model-la-domain.zip
          # sits - the repo's only genuine LFS payload. Trivy neither errors
          # nor warns; it scans nothing there and goes green. That is accepted,
          # not overlooked: the archive is speech-model data carrying no
          # dependency manifest or package metadata, so scanning it would find
          # nothing, and lfs: true would pull it on every push and PR to prove
          # that. ci.yml's verify:speech-model already reads the POINTER on
          # purpose for the same bandwidth reason. If that archive ever carries
          # executable content, this decision has to be revisited and lfs: true
          # added here. Recorded so the gap is a choice with a reason rather
          # than an accident nobody noticed.
          # NO ignore-unfixed. It answers "is a fix available", not "are we
          # exposed", so it drops any advisory upstream has not patched. This
          # workflow now runs on sdk-v* tags (see the trigger above), and the
          # release workflow's own dependency gate deliberately omits the same
          # flag. Leaving it here meant one tag ran two scans under opposite
          # policies, and the stricter one could not redden the run. Measured
          # 2026-09-09 before removing it: trivy fs over this repo reports 0
          # CRITICAL/HIGH, 0 of them unfixed, so this is a no-op today and a
          # real gate the first time an unpatched advisory lands.
