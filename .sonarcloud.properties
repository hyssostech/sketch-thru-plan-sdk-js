# Configuration for SonarQube Cloud AUTOMATIC ANALYSIS.
#
# This is NOT sonar-project.properties, and the difference matters. Automatic
# Analysis ignores sonar-project.properties entirely - "SonarQube Cloud will
# ignore the parameters in your sonar-project.properties file" - and reads this
# file instead, from the DEFAULT BRANCH only. So a change here does not take
# effect on the pull request that makes it; it applies from the merge onward.
#
# sonar-project.properties is still the right file for local scans and for any
# future CI-based analysis, and it stays. The two configure different things and
# neither is redundant.
#
# Note also: values set here OVERRIDE the same settings in the web UI, silently.
# If a setting here and in Administration > General Settings disagree, this file
# wins. And Automatic Analysis publishes no logs, so there is nothing to grep -
# the only way to confirm a setting took effect is to read the measured value.

# ---------------------------------------------------------------- duplication
# The samples are deliberately near-identical. Each one is a self-contained
# demonstration of a single feature, built so a developer can copy exactly one
# directory and have something that runs - which means they necessarily share a
# skeleton. That is the design, not debt.
#
# The consequence for analysis is that any change applied across several samples
# reads as duplicated new code. The default Sonar way gate requires <= 3% on new
# code; a change touching seven samples measured 43.2%. A gate that is red for
# doing the right thing is one people learn to route around, which is worse than
# having no gate.
#
# cpd.exclusions removes these paths from DUPLICATION DETECTION ONLY. Issues,
# bugs, vulnerabilities and security hotspots are still reported on them in full
# - which is the point, because the samples are exactly where the XSS and
# missing-SRI findings came from. This is not sonar.exclusions and must not be
# confused with it.
#
# Patterns are terminated with /* deliberately: a bare `samples/**` is a
# documented cause of exclusions being silently ignored.
# .github/ is CI tooling and its control fixtures. Measured on sdk-net PR #74:
# a test file asserting seven ways a check must fail came out 42% duplicated,
# because each control states its input verbatim. That is the intended form - a
# control that shares a builder with its siblings cannot be read in isolation,
# and being readable in isolation is what makes a control worth trusting. This
# repository has three such fixture files and would hit the same wall.
#
# The principle, so this does not decay into excluding whatever is
# inconvenient: exclude from duplication detection where repetition is the
# INTENDED FORM and the copies do not drift together - parallel samples, frozen
# fixtures, vendored code. Never where duplication signals real drift risk in
# code that evolves. src/ and plugins/ are not excluded and never should be.
sonar.cpd.exclusions=samples/**/*,quickstart/**/*,.github/**/*

# --------------------------------------------------------------------- tests
# sonar.tests is DELIBERATELY NOT SET HERE. It used to be `sonar.tests=test`,
# justified by a local measurement: classifying tests correctly moved coverage
# from 11.2% to 14.4% without a new test being written.
#
# That justification does not survive contact with Automatic Analysis. Read out
# of a failed run's own scanner context, Automatic Analysis sets:
#
#     sonar.sources=.
#     sonar.coverage.exclusions=**/*
#
# So the coverage benefit cannot exist - coverage is excluded outright, which is
# consistent with Automatic Analysis not importing coverage at all. And because
# sonar.sources is the whole repository, naming test/ as tests puts those files
# in BOTH sets, which is the "file can't be indexed twice" shape. That failure
# happens in the scanner, before a report is uploaded, so it leaves no failed
# background task to look at - only silence.
#
# The measurement that produced 11.2% -> 14.4% came from a LOCAL, CI-based scan.
# Note that sonar-project.properties ALSO sets `sonar.sources=.`, so adding
# sonar.tests there without narrowing sources first would reproduce the same
# double-indexing. If test classification is wanted for local scans, sources has
# to be narrowed in the same change - it is not a one-line addition.
#
# See STP-818. Automatic Analysis on this project stopped submitting any task at
# all from the commit that introduced this file onward.
